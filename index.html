<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chitritos World</title>
<link rel="canonical" href="https://chitritosworld.com/">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: #1d1a2b; color: #fff3d6; font: 17px/1.45 system-ui, -apple-system, sans-serif; text-align: center; }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  a { color: #ffd166; font-weight: 700; }
  img { image-rendering: pixelated; border-radius: 18px; }
</style>
</head>
<body>
<main>
  <img src="icon-180.png" width="96" height="96" alt="">
  <h1>Chitritos World se mudó ✨</h1>
  <p>Te llevo a la nueva dirección. Tu partida sigue igual: solo entra con tu correo.</p>
  <p><a id="go" href="https://chitris-world.web.app/">Toca aquí si no avanza</a></p>
</main>
<script>
(function () {
  var MAIN = 'https://chitritosworld.com/', ALT = 'https://chitris-world.web.app/';
  var rest = (location.search || '?de=github') + location.hash, done = false;   // conserva ?join=CÓDIGO, ?go=…, ?wall=1
  function go(u) { if (done) return; done = true; document.getElementById('go').href = u + rest; location.replace(u + rest); }
  /* limpia la app vieja instalada en esta dirección */
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  /* usa chitritosworld.com si ya abre; si no, chitris-world.web.app */
  var t = setTimeout(function () { go(ALT); }, 2500), img = new Image();
  img.onload = function () { clearTimeout(t); go(MAIN); };
  img.onerror = function () { clearTimeout(t); go(ALT); };
  img.src = MAIN + 'icon-180.png?t=' + Date.now();
})();
</script>
</body>
</html>
